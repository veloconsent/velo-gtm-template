homepage: "https://veloconsent.com"
documentation: "https://veloconsent.com/google-tag-manager"
versions:
  - sha: "5b1c777ec42834b65bd9156378d6b5850d737f30"
    changeNotes: "Add Brazil (LGPD) to the region-scoped consent default, matching the Velo SDK's 2026-08-05 change: BR now starts denied until the visitor decides, so a template install and a direct snippet install scope the exact same 33 regions. No new fields or permissions."
  - sha: "8ecafb7d568ae61f3a9d82dfd997b9c0e652e2f0"
    changeNotes: "Add an optional Cookie policy URL field: it appends a \"Cookie policy\" link to the end of the banner's first-layer message, travelling as a policy query parameter on the SDK src. No change to consent defaults, permissions or existing fields."
  - sha: "17247ddcce218a9bebb4f1420539440ec91a2f10"
    changeNotes: "Rename the template to Velo CMP — the tag is the full CMP, not just a banner, and the previous name buried that behind a parenthetical. No behaviour, parameter or permission changes."
  - sha: "431e944c66b7223573689ba8079633e944530eab"
    changeNotes: "Full CMP template: one tag now sets region-scoped Consent Mode v2 defaults (EEA/UK/CH opt in) and loads the Velo SDK with site/theme/API config as query params — the bridge tag and its Custom HTML snippet are retired."
  - sha: "bb7d657d528b7053585a975e357f65d298759ed8"
    changeNotes: "Strip a UTF-8 BOM at the start of template.tpl that GTM's export added — it broke the gallery submission's exact-match check for the ___TERMS_OF_SERVICE___ marker."
  - sha: "5e1af9d07a60430f731fdc69f2f0dfeab0d56b9b"
    changeNotes: "Replace hand-authored template.tpl with GTM's own export: adds the required Terms of Service section and fixes the description field, which exceeded GTM's 200-character limit and was silently dropped on save."
  - sha: "c81a17643aab91f9cdad82388e40dc38a6f8aec1"
    changeNotes: "Fix stale references to the monorepo's docs/INSTALL.md (this standalone repo has no such file) — point at this repo's own README instead."
  - sha: "47583bb00fa28a629662460ccc36c14186bc8f12"
    changeNotes: "Initial release: forwards Velo's consent decision to Google Consent Mode v2 using the SDK's category-to-signal mapping."
